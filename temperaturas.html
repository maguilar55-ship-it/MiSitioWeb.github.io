<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Temperaturas</title>
    <style>
        /* Estilos CSS opcionales para mejorar la presentación */
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #a8c0ff, #3f2b96);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 320px;
        }

        h1 {
            font-size: 24px;
            color: #333333;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555555;
        }

        input[type="number"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #4CAF50;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

        #resultado {
            margin-top: 20px;
            font-weight: bold;
            font-size: 18px;
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Título -->
        <h1>Conversor de temperaturas</h1>

        <!-- Campo para ingresar la temperatura -->
        <div class="input-group">
            <label for="temperatura">Temperatura:</label>
            <input type="number" id="temperatura" placeholder="Ingresa un valor..." step="any">
        </div>

        <!-- Lista desplegable para seleccionar la conversión -->
        <div class="input-group">
            <label for="tipoConversion">Tipo de conversión:</label>
            <select id="tipoConversion">
                <option value="cToF">Celsius a Fahrenheit</option>
                <option value="fToC">Fahrenheit a Celsius</option>
            </select>
        </div>

        <!-- Botón para ejecutar la conversión -->
        <button id="btnConvertir">Convertir</button>

        <!-- Espacio para mostrar el resultado -->
        <div id="resultado"></div>
    </div>

    <!-- Archivo JavaScript externo -->
    <script src="temperaturas.js"></script>
</body>
</html>
